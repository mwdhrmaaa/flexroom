<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexroom - Premium Gaming Achievements</title>
    <meta name="description" content="A premium library for showcasing your gaming achievements.">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <div class="particles"></div>
        
        <header class="header glass animate-fade-in">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <h1 class="logo-text text-gradient">FLEXROOM</h1>
            </div>
            <nav class="nav-links">
                <a href="#" class="active">Library</a>
                <a href="#">Top Flexes</a>
                <a href="#">Leaderboard</a>
            </nav>
            <button class="btn btn-primary" id="openModalBtn">
                + Flex Achievement
            </button>
        </header>

        <main class="main-content">
            <section class="hero animate-fade-in">
                <h1 class="hero-title">Your Gaming <span class="text-gradient">Legacy</span></h1>
                <p class="hero-subtitle">Upload, showcase, and share your most epic gaming moments in premium quality.</p>
            </section>

            <section class="library">
                <div class="achievements-grid" id="achievementsGrid">
                    <!-- Achievements will be dynamically injected here by JS -->
                </div>
            </section>
        </main>

        <div class="modal-overlay" id="uploadModal" style="display: none;">
            <div class="modal-content glass">
                <button class="close-btn" id="closeModalBtn" aria-label="Close modal">&times;</button>
                <h2 class="modal-title text-gradient">Upload Achievement</h2>
                <form id="uploadForm" class="upload-form">
                    <div class="form-group">
                        <label for="game">Game Title</label>
                        <input type="text" id="game" name="game" required placeholder="e.g. Elden Ring" />
                    </div>
                    <div class="form-group">
                        <label for="title">Achievement Name</label>
                        <input type="text" id="title" name="title" required placeholder="e.g. Elden Lord" />
                    </div>
                    <div class="form-group">
                        <label for="image">Image URL</label>
                        <input type="url" id="image" name="image" required placeholder="https://example.com/image.jpg" />
                    </div>
                    <div class="form-group">
                        <label for="rarity">Rarity</label>
                        <select id="rarity" name="rarity">
                            <option value="Common">Common</option>
                            <option value="Rare">Rare</option>
                            <option value="Epic">Epic</option>
                            <option value="Legendary">Legendary</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required rows="3" placeholder="Tell us how you got it..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary submit-btn">Flex it!</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
