<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexroom - Premium Gaming Achievements</title>
    <meta name="description" content="A premium library for showcasing your gaming achievements.">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <div class="particles"></div>
        
        <header class="header glass animate-fade-in">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <h1 class="logo-text text-gradient">FLEXROOM</h1>
            </div>
            <nav class="nav-links">
                <a href="#" class="active">Library</a>
            </nav>
        </header>

        <main class="main-content">
            <section class="hero animate-fade-in">
                <h1 class="hero-title">Your Gaming <span class="text-gradient">Legacy</span></h1>
                <p class="hero-subtitle">Upload, showcase, and share your most epic gaming moments in premium quality.</p>
            </section>

            <section class="library">
                <div class="achievements-grid" id="achievementsGrid">
                    <!-- Achievements will be dynamically injected here by JS -->
                </div>
            </section>
        </main>

        <div class="modal-overlay" id="uploadModal" style="display: none;">
            <div class="modal-content glass">
                <button class="close-btn" id="closeModalBtn" aria-label="Close modal">&times;</button>
                <h2 class="modal-title text-gradient">Upload Achievement</h2>
                <form id="uploadForm" class="upload-form">
                    <div class="form-group">
                        <label for="game">Game Title</label>
                        <input type="text" id="game" name="game" required placeholder="e.g. Elden Ring" />
                    </div>
                    <div class="form-group">
                        <label for="title">Achievement Name</label>
                        <input type="text" id="title" name="title" required placeholder="e.g. Elden Lord" />
                    </div>
                    <div class="form-group">
                        <label>Achievement Screenshot</label>
                        <div class="file-upload-wrapper glass" id="uploadDropzone">
                            <input type="file" id="imageFile" accept="image/*" class="file-input" style="display: none;" />
                            <div class="upload-placeholder" id="uploadPlaceholder">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="upload-icon">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <span>Choose from Gallery / Drag Screenshot here</span>
                            </div>
                            <div class="upload-preview" id="uploadPreview" style="display: none;">
                                <img id="previewImg" src="" alt="Preview" />
                                <button type="button" class="remove-preview-btn" id="removePreviewBtn" aria-label="Remove image">&times;</button>
                            </div>
                        </div>
                        <input type="hidden" id="image" name="image" />
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required rows="3" placeholder="Tell us how you got it..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary submit-btn">Flex it!</button>
                </form>
            </div>
        </div>

        <div class="modal-overlay" id="shareModal" style="display: none;">
            <div class="modal-content glass share-modal-content">
                <button class="close-btn" id="closeShareModalBtn" aria-label="Close modal">&times;</button>
                
                <div class="share-modal-body">
                    <!-- Left Sidebar for Template selection -->
                    <div class="share-sidebar">
                        <h3 class="sidebar-title">Templates</h3>
                        <div class="style-options vertical">
                            <button class="style-opt-btn active" data-style="brutalist">
                                <span class="opt-indicator"></span>
                                Brutalist
                            </button>
                            <button class="style-opt-btn" data-style="neon">
                                <span class="opt-indicator"></span>
                                Crimson Glow
                            </button>
                            <button class="style-opt-btn" data-style="cyber">
                                <span class="opt-indicator"></span>
                                Cyber Flux
                            </button>
                        </div>
                    </div>
                    
                    <!-- Right Main Content -->
                    <div class="share-main-content">
                        <h2 class="modal-title text-gradient">Flexcard</h2>
                        
                        <div class="share-preview-container">
                            <div id="shareLoader" class="share-loader">
                                <div class="spinner"></div>
                                <p>Forging your exclusive digital trophy...</p>
                            </div>
                            <img id="shareCardPreview" src="" alt="Share Card Preview" class="share-card-preview" style="display: none;" />
                        </div>
                        
                        <div class="share-actions">
                            <a id="downloadShareCardBtn" class="btn btn-primary download-btn" href="#" download="flexroom-trophy.png">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                Download Exclusive PNG
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
